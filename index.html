<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Shopping Pro</title>
    <!-- Google Fonts for Themes -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base / Root Variable Setups */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --font-family: 'Inter', sans-serif;
            --border-radius: 12px;
            --app-header-bg: #2563eb;
            --app-header-text: #ffffff;
            --accent-hover: #1d4ed8;
        }

        /* --- LIGHT THEME (Default) --- */
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --app-header-bg: #2563eb;
            --app-header-text: #ffffff;
        }

        /* --- DARK THEME --- */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --app-header-bg: #1e293b;
            --app-header-text: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        /* --- HARRY POTTER THEME --- */
        [data-theme="harry-potter"] {
            --bg-color: #1a0f1a;
            --card-bg: #2d192d;
            --text-color: #f3e5ab;
            --text-secondary: #d4af37;
            --accent-color: #740001;
            --border-color: #d4af37;
            --font-family: 'Cinzel', serif;
            --border-radius: 4px;
            --app-header-bg: #740001;
            --app-header-text: #ae0001;
            --accent-hover: #ae0001;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        [data-theme="harry-potter"] .btn-primary {
            color: #f3e5ab;
            border: 1px solid var(--border-color);
        }

        /* --- MINECRAFT THEME --- */
        [data-theme="minecraft"] {
            --bg-color: #4c3117; /* Dirt background color */
            --card-bg: #312113;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #5b8731; /* Grass green */
            --border-color: #22150c;
            --font-family: 'Press Start 2P', monospace;
            --border-radius: 0px;
            --app-header-bg: #5b8731;
            --app-header-text: #ffffff;
            --accent-hover: #4a6f28;
        }
        [data-theme="minecraft"] input, 
        [data-theme="minecraft"] button, 
        [data-theme="minecraft"] select {
            image-rendering: pixelated;
            font-size: 0.8rem;
        }

        /* --- CRICKET THEME --- */
        [data-theme="cricket"] {
            --bg-color: #14532d; /* Stadium Green */
            --card-bg: #166534;
            --text-color: #ffffff;
            --text-secondary: #fef08a; /* Umpire Yellow */
            --accent-color: #b45309; /* Pitch Turf Brown */
            --border-color: #ffffff;
            --font-family: 'Teko', sans-serif;
            --border-radius: 20px;
            --app-header-bg: #ffffff;
            --app-header-text: #14532d;
            --accent-hover: #9a3412;
        }
        [data-theme="cricket"] .app-header h1 {
            text-transform: uppercase;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        /* Global Structural Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Theme Selector Bar */
        .theme-selector-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
            border-radius: var(--border-radius);
        }

        .theme-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .theme-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-family: var(--font-family);
            cursor: pointer;
        }

        /* Header UI */
        .app-header {
            background-color: var(--app-header-bg);
            color: var(--app-header-text);
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Utility elements */
        .search-box {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--card-bg);
            color: var(--text-color);
            margin-bottom: 20px;
            font-family: var(--font-family);
        }

        /* Category chips */
        .categories-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .category-chip {
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            white-space: nowrap;
            cursor: pointer;
            color: var(--text-color);
            font-family: var(--font-family);
        }

        .category-chip.active {
            background: var(--accent-color);
            color: white;
        }

        /* Dynamic Item Panels */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-title {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shopping-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .shopping-list-item:last-child {
            border-bottom: none;
        }

        .item-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input actions */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--card-bg);
            color: var(--text-color);
            font-family: var(--font-family);
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font-family);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-clear {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        
        <!-- Theme Controls Selector -->
        <div class="theme-selector-container">
            <span class="theme-label">✨ Visual Display Theme:</span>
            <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="light">☀️ Light Clean Mode</option>
                <option value="dark">🌙 Midnight Dark Mode</option>
                <option value="harry-potter">🧙‍♂️ Harry Potter (Gryffindor)</option>
                <option value="minecraft">⛏️ Minecraft Overworld</option>
                <option value="cricket">🏏 Cricket Stadium Turf</option>
            </select>
        </div>

        <!-- Header Panel -->
        <div class="app-header">
            <h1 id="appTitle">🛒 Home Shopping Pro</h1>
            <p style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8;">Find it. Add it. Shop it.</p>
        </div>

        <!-- Search Feature -->
