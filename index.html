<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Shopping</title>

    <style>
        /* --- CORE CONFIGURATION (Light Mode Default) --- */
        :root {
            --bg-color: #f3f4f6;
            --header-bg: #8b5cf6;
            --header-text: #ffffff;
            --container-bg: transparent;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #9ca3af;
            --btn-add-bg: #3b82f6;
            --btn-add-text: #ffffff;
            --chip-active-bg: #3b82f6;
            --chip-active-text: #ffffff;
            --chip-bg: #ffffff;
            --btn-action-bg: #eff6ff;
            --btn-action-text: #2563eb;
            --font-family: 'Inter', sans-serif;
            --radius-main: 16px;
            --radius-card: 20px;
            --border-element: none;
            --shadow-style: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* --- DARK THEME ADJUSTMENTS --- */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --header-bg: #1e1b4b;
            --header-text: #f8fafc;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --btn-add-bg: #38bdf8;
            --btn-add-text: #0f172a;
            --chip-active-bg: #38bdf8;
            --chip-active-text: #0f172a;
            --chip-bg: #334155;
            --btn-action-bg: rgba(56, 189, 248, 0.1);
            --btn-action-text: #38bdf8;
            --shadow-style: 0 4px 12px rgba(0, 0, 0, 0.25);
        }

        /* --- HARRY POTTER THEME ADJUSTMENTS --- */
        [data-theme="harry-potter"] {
            --bg-color: #120812;
            --header-bg: #740001;
            --header-text: #f3e5ab;
            --card-bg: #2a142a;
            --text-main: #f3e5ab;
            --text-sub: #d4af37;
            --btn-add-bg: #d4af37;
            --btn-add-text: #740001;
            --chip-active-bg: #d4af37;
            --chip-active-text: #740001;
            --chip-bg: #3d1f3d;
            --btn-action-bg: rgba(212, 175, 55, 0.15);
            --btn-action-text: #d4af37;
            --font-family: 'Cinzel', serif;
            --radius-main: 4px;
            --radius-card: 6px;
            --border-element: 1px solid #d4af37;
        }

        /* --- MINECRAFT THEME ADJUSTMENTS --- */
        [data-theme="minecraft"] {
            --bg-color: #5c3e21;
            --header-bg: #4a7227;
            --header-text: #ffffff;
            --card-bg: #3c2a1a;
            --text-main: #ffffff;
            --text-sub: #868686;
            --btn-add-bg: #6da239;
            --btn-add-text: #ffffff;
            --chip-active-bg: #6da239;
            --chip-active-text: #ffffff;
            --chip-bg: #2a1d12;
            --btn-action-bg: #4d331e;
            --btn-action-text: #ffffff;
            --font-family: 'Press Start 2P', monospace;
            --radius-main: 0px;
            --radius-card: 0px;
            --border-element: 3px solid #1d120a;
            --shadow-style: none;
        }

        /* --- CRICKET THEME ADJUSTMENTS --- */
        [data-theme="cricket"] {
            --bg-color: #166534;
            --header-bg: #ffffff;
            --header-text: #166534;
            --card-bg: #15803d;
            --text-main: #ffffff;
            --text-sub: #fef08a;
            --btn-add-bg: #c2410c;
            --btn-add-text: #ffffff;
            --chip-active-bg: #c2410c;
            --chip-active-text: #ffffff;
            --chip-bg: #16a34a;
            --btn-action-bg: rgba(254, 240, 138, 0.2);
            --btn-action-text: #fef08a;
            --font-family: 'Teko', sans-serif;
            --radius-main: 24px;
            --radius-card: 28px;
            --border-element: 2px solid #ffffff;
        }

        /* --- STRUCTURE STYLING (Matches Screenshot 1 Exactly) --- */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            transition: background-color 0.2s, color 0.2s;
        }

        .top-banner {
            background-color: var(--header-bg);
            color: var(--header-text);
            text-align: center;
            padding: 50px 20px 90px 20px;
            position: relative;
            border-bottom: var(--border-element);
        }

        .top-banner h1 {
            margin: 0 0 6px 0;
            font-size: 2.4rem;
            font-weight: 700;
        }

        [data-theme="minecraft"] .top-banner h1 { font-size: 1.3rem; }
        [data-theme="cricket"] .top-banner h1 { font-size: 3.8rem; text-transform: uppercase; }

        .top-banner p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.85;
        }

        .config-menu {
            position: absolute;
            top: 20px;
            right: 25px;
        }

        .selector-box {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: inherit;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        [data-theme="cricket"] .selector-box {
            background: #ffffff;
            color: #166534;
            border: 2px solid #166534;
        }

        .selector-box option {
            background-color: #ffffff;
            color: #1f2937;
        }

        .app-body {
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: -30px;
            margin-bottom: 35px;
            position: relative;
            z-index: 5;
        }

        .input-container {
            position: relative;
            flex-grow: 1;
        }

        .main-search {
            width: 100%;
            padding: 18px 20px 18px 50px;
            box-sizing: border-box;
            border: var(--border-element);
            border-radius: var(--radius-main);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 0.95rem;
            box-shadow: var(--shadow-style);
            outline: none;
        }

        .prefix-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .action-btn {
            padding: 18px 30px;
            background-color: var(--btn-add-bg);
            color: var(--btn-add-text);
            border: var(--border-element);
            border-radius: var(--radius-main);
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
            box-shadow: var(--shadow-style);
            white-space: nowrap;
        }

        [data-theme="minecraft"] .main-search,
        [data-theme="minecraft"] .action-btn {
            font-size: 0.75rem;
        }

        .layout-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
        }

        .horizontal-scroller {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 30px;
        }

        .category-element {
            background-color: var(--chip-bg);
            border: var(--border-element);
            border-radius: var(--radius-main);
            min-width: 80px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow-style);
        }

        .category-element.active {
            background-color: var(--chip-active-bg);
            color: var(--chip-active-text);
        }

        .element-ico {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
        }

        .element-lbl {
            font-size: 0.8rem;
            font-weight: 500;
        }

        [data-theme="minecraft"] .element-lbl { font-size: 0.55rem; }

        .items-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .item-box {
            background-color: var(--card-bg);
            border: var(--border-element);
            border-radius: var(--radius-card);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-style);
        }

        .item-ico {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .item-name {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 2px 0;
        }

        .item-tag {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .btn-trigger {
            width: 100%;
            padding: 10px;
            background-color: var(--btn-action-bg);
            color: var(--btn-action-text);
            border: var(--border-element);
            border-radius: 10px;
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
        }
        
        [data-theme="minecraft"] .btn-trigger {
            border-radius: 0;
            font-size: 0.6rem;
        }
